name: Daily Tech Stock Research Report

on:
  schedule:
    # 12:30 UTC weekdays = 8:30 AM EDT (summer) / 7:30 AM EST (winter)
    # GitHub cron can run 5-20 min late under load.
    - cron: '30 12 * * 1-5'
  workflow_dispatch:  # allow manual run from Actions tab

permissions:
  contents: write  # needed to commit the report back

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily report
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python3 report_generator.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No new report to commit."
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "Daily report: $DATE"
            git push
          fi
