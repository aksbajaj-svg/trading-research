name: Daily Tech Stock Research Report

on:
  schedule:
    # 12:30 UTC weekdays = 8:30 AM EDT (summer) / 7:30 AM EST (winter)
    # GitHub cron can run 5-20 min late under load.
    - cron: '30 12 * * 1-5'
  workflow_dispatch:  # allow manual run from Actions tab

permissions:
  contents: write  # needed to commit the report back

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system deps for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate daily report
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python3 report_generator.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No new report to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Daily report: $DATE"
          # Retry up to 3 times to handle races with concurrent runs.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push failed (attempt $i), retrying..."
            sleep 3
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
